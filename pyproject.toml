[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mirrorwall"
description = "Design tokens, layout, component macros, SSE and JSON/error envelope helpers so three applications look like one family without sharing a page."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Local AI Suite contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "baseaicore>=0.4,<0.5",
    # Widened at 0.2.2 from `<0.5`. This package touches three names from setspec — `GeneratorInfo`,
    # `SchemaVersion` and `dump_envelope`, all in `sse.py` — and all three are v1.0 payload surface,
    # frozen under ADR-0009. The cap was costing far more than it protected: mirrorwall is a
    # dependency of every application, so `<0.5` held all four of them at setspec 0.4 no matter what
    # they needed, and PromptCadence P6 needs `governance.egress_decision` (0.5) while FreeWeight 1.1
    # needs `capability.evidence` 1.1 (0.6). Verified against 0.6.0 before the widen landed.
    "setspec>=0.4,<0.7",
    "jinja2>=3.1,<4",
    # >=1.3.1 excludes PYSEC-2026-161, -248, -249, -2280 and -2281, none of which has a fix in
    # the 0.x line. The cap was also simply wrong: FreeWeight and LoadCoach, this package's
    # two consumers, already run starlette 1.6 under fastapi 0.141, so `<1` made mirrorwall
    # un-coinstallable with the applications it exists to serve.
    "starlette>=1.3.1,<2",
    # sse_response dispatches every call into the synchronous EventSource with
    # anyio.to_thread.run_sync (ADR-0003 §6-8). Starlette pulls anyio in transitively, but a
    # module this package imports directly is declared directly.
    "anyio>=4,<5",
]

[project.optional-dependencies]
dev = [
    # >=9.0.3 excludes PYSEC-2026-1845 (vulnerable /tmp/pytest-of-{user} handling,
    # affecting pytest through 9.0.2). Matches the pin BaseAiCore, SetSpec, ModelRack and
    # SweatMeter already moved to.
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<6",
    "pytest-randomly>=3,<4",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "import-linter>=2.0,<3",
    "respx>=0.21,<1",
]

[project.urls]
Homepage = "https://github.com/JPKell/MirrorWall"
Documentation = "https://github.com/JPKell/MirrorWall/tree/main/docs"
Changelog = "https://github.com/JPKell/MirrorWall/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/mirrorwall/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mirrorwall"]
# Templates, CSS, JS, icons and the asset manifest are package data, not source. Hatchling
# includes every non-Python file under a listed package by default; these patterns are stated
# explicitly so a future exclude cannot silently drop the half of this package that is not Python.
artifacts = [
    "src/mirrorwall/templates/**",
    "src/mirrorwall/static/**",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "T20", "DTZ", "PTH", "D1", "BLE"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "-m 'not live and not performance'"
markers = [
    "live: requires a real provider/GPU, never in default CI",
    "performance: performance budget assertions, excluded by default",
    "contract: public API/schema conformance in both directions",
]
testpaths = ["tests"]

[tool.coverage.run]
# The importable name, not the source path: CI installs the built distribution rather than an
# editable checkout (Packaging Standards §4), so coverage must find the package wherever it is
# installed. `paths` folds the two locations into one name in the report.
source = ["mirrorwall"]
branch = true

[tool.coverage.paths]
source = ["src/mirrorwall", "*/site-packages/mirrorwall"]

[tool.coverage.report]
# Shared packages carry a 95% floor, not the 85% applications use: three applications inherit
# every line here, and a bug in a component is a bug in all of them.
fail_under = 95
show_missing = true
